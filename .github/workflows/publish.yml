name: Publish

on:
  release:
    types: [published]

permissions:
  contents: write
  # Lets ovsx exchange a GitHub OIDC token for a short-lived Open VSX token
  # (trusted publishing), so no Open VSX secret is stored
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Check tag matches package.json version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Package .vsix
        id: pack
        run: |
          vsix="$(node -p "require('./package.json').name")-${GITHUB_REF_NAME#v}.vsix"
          npx vsce package --no-dependencies --out "$vsix"
          echo "vsix=$vsix" >> "$GITHUB_OUTPUT"

      - name: Publish to Open VSX
        run: npx --yes ovsx@1.2.0 publish "${{ steps.pack.outputs.vsix }}" --trusted-publishing --skip-duplicate

      # The VS Code Marketplace is published manually by uploading the attached
      # .vsix at https://marketplace.visualstudio.com/manage. Automating it needs
      # either a global Azure DevOps PAT (retired 2026-12-01, and new DevOps orgs
      # require an Azure subscription) or Microsoft Entra ID sign-in via
      # `vsce publish --azure-credential`, which needs an Azure tenant.

      - name: Attach .vsix to release
        run: gh release upload "$GITHUB_REF_NAME" "${{ steps.pack.outputs.vsix }}"
        env:
          GH_TOKEN: ${{ github.token }}
