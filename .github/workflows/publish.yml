name: Publish

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Check tag matches package.json version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Publish to Open VSX
        id: ovsx
        uses: HaaLeo/publish-vscode-extension@1b8df468b849f76a143b8c18bf0ffa2075398d12 # v2
        with:
          pat: ${{ secrets.OVSX_PAT }}
          dependencies: false

      # The VS Code Marketplace is published manually by uploading the attached
      # .vsix at https://marketplace.visualstudio.com/manage. Automating it needs
      # either a global Azure DevOps PAT (retired 2026-12-01, and new DevOps orgs
      # require an Azure subscription) or Microsoft Entra ID sign-in via
      # `vsce publish --azure-credential`, which needs an Azure tenant.

      - name: Attach .vsix to release
        run: gh release upload "$GITHUB_REF_NAME" "${{ steps.ovsx.outputs.vsixPath }}"
        env:
          GH_TOKEN: ${{ github.token }}
